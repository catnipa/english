name: Daily news

on:
  schedule:
    - cron: "5 22 * * *"   # 매일 22:05 UTC = 한국 시간 07:05 (GitHub 사정으로 몇 분~수십 분 늦어질 수 있음)
  workflow_dispatch: {}     # Actions 탭에서 'Run workflow'로 바로 실행
  push:                     # 설정 파일을 고치면 바로 다시 수집
    branches: [main]
    paths: [".github/workflows/daily.yml", "config.json", "my_glossary.tsv", "build_site.py", "core/**"]

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect news and build the site (rules only, no AI)
        run: python build_site.py
      - name: Save to the repository
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "news: $(date -u +%F)"
          git push
